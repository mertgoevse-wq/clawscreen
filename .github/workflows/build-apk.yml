name: build-apk

# Builds the ClawScreen Companion APK and offers it as an artifact.
# The APK is not published anywhere: the user installs it from Termux with
# `adb install` (spec section 10).

on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'companion/**'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: companion
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clawscreen-companion-debug
          path: companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn